<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="extName">Neon Horizon — CRT &amp; VHS Shader</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="panel" id="popup-panel">
    <header class="header">
      <div class="brand">
        <img src="icons/icon48.png" alt="" class="logo" />
        <div>
          <div class="title">NEON HORIZON</div>
          <div class="subtitle" data-i18n="popupSubtitle">CRT &amp; VHS Shader</div>
        </div>
      </div>
      <label class="power-switch" title="Toggle shader on/off (Alt+Shift+V)" data-i18n-title="toggleShaderTitle">
        <input type="checkbox" id="toggle-enabled" data-role="toggle-enabled" />
        <span class="power-track">
          <span class="power-thumb"></span>
        </span>
      </label>
    </header>

    <div class="site-row" id="site-row">
      <button id="toggle-site" class="site-btn" type="button">
        <span class="site-dot"></span>
        <span id="site-label" data-i18n="checkingTab">Checking tab...</span>
      </button>
    </div>

    <section class="presets" aria-label="Presets" data-i18n-aria-label="presetsAriaLabel">
      <button class="preset-btn" data-preset="soft" type="button" data-i18n="presetSoft">Soft CRT</button>
      <button class="preset-btn" data-preset="outrun" type="button" data-i18n="presetOutrun">Outrun 84</button>
      <button class="preset-btn" data-preset="vhs" type="button" data-i18n="presetVhs">VHS Tape</button>
      <button class="preset-btn" data-preset="minimal" type="button" data-i18n="presetMinimal">Minimal</button>
    </section>

    <section class="sliders">
      <div class="slider-row">
        <div class="slider-head">
          <label for="slider-curvature" id="label-curvature" data-i18n="labelCurvatureCrt">Screen curvature (CRT)</label>
          <span class="val" id="val-curvature" data-val="curvature">40%</span>
        </div>
        <input type="range" id="slider-curvature" data-slider="curvature" min="0" max="100" value="40" />
      </div>

      <div class="slider-row">
        <div class="slider-head">
          <label for="slider-scanlines" data-i18n="labelScanlines">Interlaced scanlines</label>
          <span class="val" id="val-scanlines" data-val="scanlines">52%</span>
        </div>
        <input type="range" id="slider-scanlines" data-slider="scanlines" min="0" max="100" value="52" />
      </div>

      <div class="slider-row">
        <div class="slider-head">
          <label for="slider-bloom" data-i18n="labelBloom">Phosphor bloom glow</label>
          <span class="val" id="val-bloom" data-val="bloom">36%</span>
        </div>
        <input type="range" id="slider-bloom" data-slider="bloom" min="0" max="100" value="36" />
      </div>

      <div class="slider-row">
        <div class="slider-head">
          <label for="slider-vhs" data-i18n="labelVhs">VHS tape &amp; chromaticity</label>
          <span class="val" id="val-vhs" data-val="vhs">75%</span>
        </div>
        <input type="range" id="slider-vhs" data-slider="vhs" min="0" max="100" value="75" />
      </div>

      <div class="slider-row">
        <div class="slider-head">
          <label for="slider-sweep" data-i18n="labelSweep">Scan sweep bar</label>
          <span class="val" id="val-sweep" data-val="sweep">60%</span>
        </div>
        <input type="range" id="slider-sweep" data-slider="sweep" min="0" max="100" value="60" />
      </div>

      <div class="slider-row">
        <div class="slider-head">
          <label for="slider-vignette" data-i18n="labelVignette">Glass &amp; vignette</label>
          <span class="val" id="val-vignette" data-val="vignette">48%</span>
        </div>
        <input type="range" id="slider-vignette" data-slider="vignette" min="0" max="100" value="48" />
      </div>
    </section>

    <footer class="footer">
      <label class="anim-toggle">
        <input type="checkbox" id="toggle-animate" data-role="toggle-animate" />
        <span data-i18n="scanAnimation">Scan animation</span>
      </label>
      <button id="btn-reset" data-role="reset-btn" class="reset-btn" type="button" data-i18n="resetBtn">Reset</button>
    </footer>

    <div class="hotkey-hint"><span data-i18n="quickTogglePrefix">Quick toggle:</span> <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>V</kbd></div>
  </div>

  <script src="shared/defaults.js"></script>
  <script src="shared/i18n.js"></script>
  <script src="shared/controls.js"></script>
  <script src="popup.js"></script>
</body>
</html>
