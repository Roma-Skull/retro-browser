<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Tab — Neon Horizon</title>
  <link rel="icon" type="image/png" sizes="48x48" href="icons/icon48.png" />
  <link rel="stylesheet" href="newtab.css" />
</head>
<body>
  <div id="bg-fallback" aria-hidden="true"></div>
  <canvas id="crt-bg" aria-hidden="true"></canvas>

  <main class="stage">
    <header class="hero-top">
      <div class="clock-wrap">
        <div id="clock-time" class="clock-time">00:00</div>
        <div id="clock-date" class="clock-date"></div>
      </div>

      <form id="search-form" class="search-bar" autocomplete="off">
        <button type="button" id="engine-btn" class="engine-btn" title="Switch search engine">Google</button>
        <input
          type="text"
          id="search-input"
          class="search-input"
          placeholder="Search or enter URL..."
          aria-label="Search or enter URL"
          autofocus
        />
        <button type="submit" class="search-submit" title="Search">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="20" y1="20" x2="16.2" y2="16.2"></line>
          </svg>
        </button>
      </form>

      <section class="sites-section" aria-label="Quick Sites">
        <div id="sites-grid" class="sites-grid"></div>
      </section>
    </header>
  </main>

  <!-- Floating CRT/VHS Shader Configuration Button & Drawer -->
  <div class="shader-dock">
    <section id="crt-drawer" class="crt-drawer" hidden aria-label="New Tab CRT and VHS settings">
      <div class="drawer-head">
        <div>
          <div class="drawer-title">NEW TAB CRT / VHS</div>
          <div class="drawer-sub">WebGL2 New Tab Shader</div>
        </div>
        <label class="power-switch" title="Toggle New Tab shader on/off">
          <input type="checkbox" data-role="toggle-enabled" />
          <span class="power-track"><span class="power-thumb"></span></span>
        </label>
      </div>

      <div class="sync-row">
        <label class="sync-check" title="Use the same settings on New Tab as on websites">
          <input type="checkbox" id="toggle-sync-sites" />
          <span>Sync with sites</span>
        </label>
        <button type="button" id="btn-copy-sites" class="copy-btn" title="Copy current settings from websites">Copy</button>
      </div>

      <div class="bg-anim-row">
        <label class="sync-check" title="Animate neon grid flight, twinkling stars, and pulsing sun">
          <input type="checkbox" id="toggle-animate-bg" />
          <span>Live background (grid flight)</span>
        </label>
      </div>

      <div class="presets">
        <button class="preset-btn" data-preset="soft" type="button">Soft CRT</button>
        <button class="preset-btn" data-preset="outrun" type="button">Outrun 84</button>
        <button class="preset-btn" data-preset="vhs" type="button">VHS Tape</button>
        <button class="preset-btn" data-preset="minimal" type="button">Minimal</button>
      </div>

      <div class="sliders">
        <div class="slider-row">
          <div class="slider-head">
            <label for="nt-curvature">Screen curvature (CRT)</label>
            <span class="val" data-val="curvature">40%</span>
          </div>
          <input type="range" id="nt-curvature" data-slider="curvature" min="0" max="100" value="40" />
        </div>

        <div class="slider-row">
          <div class="slider-head">
            <label for="nt-scanlines">Interlaced scanlines</label>
            <span class="val" data-val="scanlines">52%</span>
          </div>
          <input type="range" id="nt-scanlines" data-slider="scanlines" min="0" max="100" value="52" />
        </div>

        <div class="slider-row">
          <div class="slider-head">
            <label for="nt-bloom">Phosphor bloom glow</label>
            <span class="val" data-val="bloom">36%</span>
          </div>
          <input type="range" id="nt-bloom" data-slider="bloom" min="0" max="100" value="36" />
        </div>

        <div class="slider-row">
          <div class="slider-head">
            <label for="nt-vhs">VHS tape &amp; chromaticity</label>
            <span class="val" data-val="vhs">75%</span>
          </div>
          <input type="range" id="nt-vhs" data-slider="vhs" min="0" max="100" value="75" />
        </div>

        <div class="slider-row">
          <div class="slider-head">
            <label for="nt-sweep">Scan sweep bar</label>
            <span class="val" data-val="sweep">60%</span>
          </div>
          <input type="range" id="nt-sweep" data-slider="sweep" min="0" max="100" value="60" />
        </div>

        <div class="slider-row">
          <div class="slider-head">
            <label for="nt-vignette">Glass &amp; vignette</label>
            <span class="val" data-val="vignette">48%</span>
          </div>
          <input type="range" id="nt-vignette" data-slider="vignette" min="0" max="100" value="48" />
        </div>
      </div>

      <div class="drawer-foot">
        <label class="anim-toggle">
          <input type="checkbox" data-role="toggle-animate" />
          <span>Scan animation</span>
        </label>
        <button type="button" class="reset-btn" data-role="reset-btn">Reset</button>
      </div>
    </section>

    <button type="button" id="btn-toggle-drawer" class="dock-btn" aria-expanded="false">
      <span id="dock-dot" class="dock-dot"></span>
      <span>CRT / VHS</span>
    </button>
  </div>

  <!-- Add Quick Site Modal -->
  <div id="add-modal" class="modal-backdrop" hidden>
    <form id="add-site-form" class="modal-card" autocomplete="off">
      <div class="modal-title">Add Quick Site</div>
      <label class="field-label">
        <span>Name</span>
        <input type="text" id="add-title" placeholder="e.g. GitHub" maxlength="32" required />
      </label>
      <label class="field-label">
        <span>Address (URL)</span>
        <input type="text" id="add-url" placeholder="https://github.com" required />
      </label>
      <div class="modal-actions">
        <button type="button" id="btn-cancel-add" class="btn-secondary">Cancel</button>
        <button type="submit" class="btn-primary">Add</button>
      </div>
    </form>
  </div>

  <script src="shared/defaults.js"></script>
  <script src="shared/controls.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
